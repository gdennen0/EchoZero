# Build EchoZero release artifacts, verify them from first principles, then publish.
# Trigger: push a version tag (e.g. v1.0.0).
#
# Release invariant: public GitHub assets are the product. A release is not valid
# until the uploaded/downloaded assets match the generated manifest and pass the
# artifact verifier.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build (macOS)
        env:
          MEMBERSTACK_APP_SECRET: ${{ secrets.MEMBERSTACK_APP_SECRET }}
        run: python scripts/build_app.py --clean

      - name: Create and verify macOS archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          versioned="EchoZero-${GITHUB_REF_NAME}-macos-arm64.zip"
          convenience="EchoZero-macOS.zip"

          cd dist
          rm -f "$versioned" "$convenience" "${versioned%.zip}.sha256" macos-release-verification.json
          ditto -c -k --sequesterRsrc --keepParent EchoZero.app "$versioned"
          cp "$versioned" "$convenience"
          shasum -a 256 "$versioned" > "${versioned%.zip}.sha256"
          test "$(shasum -a 256 "$versioned" | awk '{print $1}')" = "$(shasum -a 256 "$convenience" | awk '{print $1}')"
          cd ..

          python scripts/verify_macos_release_artifact.py "dist/$versioned" \
            --compare-zip "dist/$convenience" \
            --report-path dist/macos-release-verification.json

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EchoZero-macOS
          path: |
            dist/EchoZero-v*-macos-arm64.zip
            dist/EchoZero-v*-macos-arm64.sha256
            dist/EchoZero-macOS.zip
            dist/build-metadata.json
            dist/macos-release-verification.json

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build (Windows)
        env:
          MEMBERSTACK_APP_SECRET: ${{ secrets.MEMBERSTACK_APP_SECRET }}
        run: python scripts/build_app.py --clean

      - name: Create Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versioned = "EchoZero-$env:GITHUB_REF_NAME-windows-x64.zip"
          $versionedPath = Join-Path 'dist' $versioned
          $conveniencePath = Join-Path 'dist' 'EchoZero-Windows.zip'
          $shaPath = Join-Path 'dist' ($versioned -replace '\.zip$', '.sha256')
          Remove-Item -LiteralPath $versionedPath, $conveniencePath, $shaPath -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path 'dist\EchoZero' -DestinationPath $versionedPath -Force
          [System.IO.File]::Copy((Resolve-Path -LiteralPath $versionedPath), (Join-Path (Resolve-Path -LiteralPath 'dist') 'EchoZero-Windows.zip'), $true)
          $versionedHash = (Get-FileHash -LiteralPath $versionedPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $convenienceHash = (Get-FileHash -LiteralPath $conveniencePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $shaPath), "$versionedHash  $versioned`n", $utf8NoBom)
          if ($versionedHash -ne $convenienceHash) {
            throw "Windows convenience and versioned zip SHA256 values differ: $versionedHash vs $convenienceHash"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EchoZero-Windows
          path: |
            dist/EchoZero-v*-windows-x64.zip
            dist/EchoZero-v*-windows-x64.sha256
            dist/EchoZero-Windows.zip
            dist/build-metadata.json

  release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish exact release asset set
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          assets=(
            release-artifacts/EchoZero-macOS/EchoZero-${tag}-macos-arm64.zip
            release-artifacts/EchoZero-macOS/EchoZero-${tag}-macos-arm64.sha256
            release-artifacts/EchoZero-macOS/EchoZero-macOS.zip
            release-artifacts/EchoZero-macOS/build-metadata.json
            release-artifacts/EchoZero-macOS/macos-release-verification.json
            release-artifacts/EchoZero-Windows/EchoZero-${tag}-windows-x64.zip
            release-artifacts/EchoZero-Windows/EchoZero-${tag}-windows-x64.sha256
            release-artifacts/EchoZero-Windows/EchoZero-Windows.zip
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --target "$GITHUB_SHA" --latest --prerelease=false --title "EchoZero $tag"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --latest --title "EchoZero $tag" --generate-notes
          fi

          expected_names=(
            "EchoZero-${tag}-macos-arm64.zip"
            "EchoZero-${tag}-macos-arm64.sha256"
            "EchoZero-macOS.zip"
            "build-metadata.json"
            "macos-release-verification.json"
            "EchoZero-${tag}-windows-x64.zip"
            "EchoZero-${tag}-windows-x64.sha256"
            "EchoZero-Windows.zip"
          )
          for name in "${expected_names[@]}"; do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq ".assets[] | select(.name==\"$name\") | .id" || true)
            if [ -n "$id" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$id" >/dev/null
            fi
          done

          gh release upload "$tag" "${assets[@]}"

      - name: Verify uploaded release asset metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          target=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.target_commitish')
          test "$target" = "$GITHUB_SHA"
          tmp=$(mktemp -d)
          gh release download "$tag" --dir "$tmp" \
            --pattern 'EchoZero-macOS.zip' \
            --pattern "EchoZero-${tag}-macos-arm64.zip" \
            --pattern "EchoZero-${tag}-macos-arm64.sha256" \
            --pattern 'EchoZero-Windows.zip' \
            --pattern "EchoZero-${tag}-windows-x64.zip" \
            --pattern "EchoZero-${tag}-windows-x64.sha256"
          test "$(shasum -a 256 "$tmp/EchoZero-macOS.zip" | awk '{print $1}')" = "$(shasum -a 256 "$tmp/EchoZero-${tag}-macos-arm64.zip" | awk '{print $1}')"
          test "$(shasum -a 256 "$tmp/EchoZero-Windows.zip" | awk '{print $1}')" = "$(shasum -a 256 "$tmp/EchoZero-${tag}-windows-x64.zip" | awk '{print $1}')"
          (cd "$tmp" && shasum -a 256 -c "EchoZero-${tag}-macos-arm64.sha256")
          (cd "$tmp" && shasum -a 256 -c "EchoZero-${tag}-windows-x64.sha256")
